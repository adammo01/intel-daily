<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>归档 · 收藏情报日报</title>
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#fafbfc;
  --text:#1a1d21; --text-2:#4b5563; --muted:#8b939e;
  --border:#e5e7eb; --border-2:#eef0f3;
  --accent:#2563eb; --accent-soft:#eff4ff;
  --code-bg:#f3f4f6; --quote-bg:#f8fafc;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:#0e1013; --surface:#16181d; --surface-2:#1b1e24;
  --text:#e6e8eb; --text-2:#b6bcc5; --muted:#7d848e;
  --border:#272b32; --border-2:#21242a;
  --accent:#6ea8fe; --accent-soft:#1a2433;
  --code-bg:#1e2128; --quote-bg:#191c22;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --surface:#16181d; --surface-2:#1b1e24;
    --text:#e6e8eb; --text-2:#b6bcc5; --muted:#7d848e;
    --border:#272b32; --border-2:#21242a;
    --accent:#6ea8fe; --accent-soft:#1a2433;
    --code-bg:#1e2128; --quote-bg:#191c22;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:15px/1.72 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
       "Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:860px; margin:0 auto; padding:0 18px 56px}

/* 顶栏 */
.topbar{
  position:sticky; top:0; z-index:20;
  background:var(--surface);
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar-in{max-width:860px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:12px}
.brand{display:flex; flex-direction:column; gap:1px; min-width:0; flex:1}
.brand b{font-size:15px; font-weight:650; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand span{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tb-right{display:flex; align-items:center; gap:6px; flex:none}
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:30px; padding:4px 10px; font-size:12.5px; line-height:1;
  color:var(--text-2); background:var(--surface-2);
  border:1px solid var(--border); border-radius:8px;
  cursor:pointer; font-family:inherit; white-space:nowrap;
}
.btn:hover{color:var(--text); border-color:var(--muted)}
.btn.icon{width:30px; padding:0; font-size:14px}

/* 页面头 */
.hero{padding:22px 0 12px}
.hero h1{margin:0 0 6px; font-size:23px; line-height:1.35; letter-spacing:-.2px}
.hero .meta{color:var(--muted); font-size:12.5px; display:flex; flex-wrap:wrap; gap:6px 14px}
.chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.chip{
  font-size:11.5px; padding:2.5px 8px; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); border:1px solid transparent;
}
.chip.grey{background:var(--surface-2); color:var(--text-2); border-color:var(--border)}

/* 正文卡片 */
.card{
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
  padding:20px 22px; margin-top:14px;
}
.content>*:first-child{margin-top:0}
.content>*:last-child{margin-bottom:0}
.content h1{font-size:21px; margin:22px 0 10px; letter-spacing:-.2px}
.content h2{
  font-size:16.5px; margin:24px 0 10px; padding-bottom:7px;
  border-bottom:1px solid var(--border-2); letter-spacing:-.1px;
}
.content h3{font-size:15px; margin:18px 0 7px; color:var(--text); font-weight:650}
.content h4,.content h5,.content h6{font-size:14px; margin:14px 0 6px; color:var(--text-2)}
.content p{margin:9px 0; color:var(--text-2)}
.content strong{color:var(--text); font-weight:650}
.content ul,.content ol{margin:8px 0; padding-left:20px}
.content li{margin:4px 0; color:var(--text-2)}
.content li.lvl2{list-style-type:circle; margin-left:8px}
.content hr{border:0; border-top:1px solid var(--border); margin:20px 0}
.content blockquote{
  margin:12px 0; padding:10px 14px; background:var(--quote-bg);
  border-left:3px solid var(--accent); border-radius:0 8px 8px 0; color:var(--text-2);
}
.content blockquote p{margin:4px 0}
.content code{
  font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  font-size:12.5px; background:var(--code-bg); padding:1.5px 5px; border-radius:5px;
  color:var(--text); word-break:break-word;
}
.content pre{
  margin:12px 0; padding:13px 15px; background:var(--code-bg);
  border:1px solid var(--border-2); border-radius:8px; overflow-x:auto;
}
.content pre code{background:none; padding:0; font-size:12.5px; line-height:1.6}

/* 表格 */
.table-wrap{overflow-x:auto; margin:12px 0; -webkit-overflow-scrolling:touch}
.content table{border-collapse:collapse; width:100%; font-size:13.5px; min-width:320px}
.content th,.content td{
  border:1px solid var(--border); padding:7px 10px; text-align:left; vertical-align:top;
}
.content th{background:var(--surface-2); font-weight:620; color:var(--text); white-space:nowrap}
.content td{color:var(--text-2)}
.content tbody tr:nth-child(even){background:var(--surface-2)}

/* 归档列表 */
.list{display:flex; flex-direction:column; gap:8px; margin-top:14px}
.item{
  display:flex; align-items:center; gap:12px; padding:11px 14px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow);
}
.item:hover{border-color:var(--accent); text-decoration:none}
.item .d{
  flex:none; font-variant-numeric:tabular-nums; font-size:12.5px; color:var(--muted);
  padding:3px 8px; background:var(--surface-2); border-radius:6px; border:1px solid var(--border-2);
}
.item .t{flex:1; min-width:0; font-size:14px; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .n{flex:none; font-size:12px; color:var(--muted)}

.nav{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap}
.nav .btn{flex:1; min-width:120px; justify-content:center; min-height:36px}

.foot{margin-top:26px; padding-top:14px; border-top:1px solid var(--border); color:var(--muted); font-size:12px; line-height:1.9}
.foot code{background:var(--code-bg); padding:1px 5px; border-radius:4px; font-size:11.5px}
.empty{padding:40px 20px; text-align:center; color:var(--muted); font-size:13.5px}

@media (max-width:560px){
  .wrap{padding:0 13px 44px}
  .topbar-in{padding:9px 13px}
  .card{padding:15px 15px; border-radius:9px}
  .hero h1{font-size:20px}
  .content h1{font-size:19px}
  .content h2{font-size:15.5px}
  .item{padding:10px 12px; gap:9px}
  .item .t{font-size:13.5px}
}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in">
  <div class="brand"><b>收藏情报日报</b><span>抖音 / B 站 每日收藏归纳</span></div>
  <div class="tb-right">
    <a class="btn" href="archive.html">归档</a>
    <button class="btn icon" id="themeBtn" type="button" title="切换主题" aria-label="切换主题">◑</button>
  </div>
</div></header>
<main class="wrap">
<section class="hero"><h1>全部归档</h1><div class="meta"><span>共 2 期</span></div></section><div class="card" style="padding:6px"><div class="list"><a class="item" href="2026-10-03.html"><span class="d">2026-10-03</span><span class="t">2026-10-03 收藏情报日报</span><span class="n">153 条 · 知识库 7</span></a><a class="item" href="2026-10-02.html"><span class="d">2026-10-02</span><span class="t">2026-10-02 收藏情报日报</span><span class="n"></span></a></div></div>

<div class="foot">由「收藏情报系统」自动生成 ｜ 内容来自本人在 B 站与抖音的收藏，原视频版权归原作者所有</div>
</main>
<script>
(function(){
  var KEY='intel-theme', root=document.documentElement;
  function sys(){try{return window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}catch(e){return 'light';}}
  function cur(){return root.getAttribute('data-theme')||sys();}
  function paint(){var b=document.getElementById('themeBtn'); if(b){b.textContent=cur()==='dark'?'\u25D0':'\u25D1'; b.title=cur()==='dark'?'切换到浅色':'切换到深色';}}
  try{var s=localStorage.getItem(KEY); if(s){root.setAttribute('data-theme',s);}}catch(e){}
  window.__toggleTheme=function(){
    var next=cur()==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next);}catch(e){}
    paint();
  };
  if(document.readyState!=='loading'){paint();}else{document.addEventListener('DOMContentLoaded',paint);}
})();
</script>
</body>
</html>
